<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PiggyNotebook</title>
<style>
  :root {
    --orange: #F97316;
    --orange-dark: #F2660F;
    --text: #222;
    --text-muted: #767676;
    --bg: #FFF9F3;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .icon {
    width: 108px;
    height: 108px;
    border-radius: 26px;
    box-shadow: 0 8px 24px rgba(242, 102, 15, 0.25);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }
  .tagline {
    font-size: 15px;
    color: var(--text-muted);
    margin: 0 0 32px;
    line-height: 1.6;
  }
  .download-area {
    width: 100%;
    margin-bottom: 32px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: var(--orange);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(249, 115, 22, 0.35);
    margin-bottom: 12px;
  }
  .btn:active { background: var(--orange-dark); }
  .btn.secondary {
    background: #fff;
    color: var(--orange);
    border: 2px solid var(--orange);
    box-shadow: none;
  }
  .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .weixin-notice {
    background: #FFF3E0;
    border-radius: 14px;
    padding: 20px;
    font-size: 15px;
    line-height: 1.7;
    color: #8a4b09;
    width: 100%;
  }
  .profile {
    width: 100%;
    background: var(--card);
    border-radius: 18px;
    padding: 24px 20px;
    text-align: left;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .profile h2 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  .profile p {
    font-size: 14px;
    line-height: 1.8;
    color: #444;
    margin: 0 0 10px;
  }
  .profile ul {
    margin: 0;
    padding-left: 20px;
    font-size: 14px;
    line-height: 1.9;
    color: #444;
  }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>

  <h1>PiggyNotebook</h1>
  <p class="tagline">随手说一句，AI 帮你归类到主题里，自动汇总零散的想法</p>

  <div class="download-area" id="download-area"></div>

  <div class="profile">
    <h2>这是什么</h2>
    <p>你有没有过这种经历：一个想法隔了几天、几周才又想起来，却找不到之前记的在哪、写了什么？PiggyNotebook 就是解决这个问题的——随口说一句或打几个字，AI 自动判断它属于哪个主题，同一主题下的碎片会自动汇总成一段连贯的回顾，不用自己整理。</p>
    <p>适合这些人：</p>
    <ul>
      <li>创业者 / 产品经理：长期主题的持续思考</li>
      <li>学习者：知识点反复回忆、巩固</li>
      <li>写作者：素材积累与主题写作</li>
      <li>研究 / 投资：长期跟踪一个话题</li>
    </ul>
  </div>

  <div class="footer">当前为内测版本，欢迎试用并反馈</div>
</div>

<script>
  var IOS_LINK = "https://testflight.apple.com/join/5jy95EkM";
  // TODO: swap for the direct 蒲公英 downloadURL (via their API) before
  // sending real traffic here — this short link is the same ad-laden
  // landing page that was causing accidental-click confusion.
  var ANDROID_LINK = "https://www.pgyer.com/piggynotebook";

  var ua = navigator.userAgent || "";
  // WeChat's in-app browser is confirmed to break downloads — keep this one.
  // TikTok's in-app browser was suspected of the same thing but the user
  // directly tested the real download button inside TikTok's browser and
  // it worked fine — so no special-casing for TikTok, it just falls
  // through to the normal iOS/Android buttons below.
  var isInAppBrowser = /MicroMessenger/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  var area = document.getElementById("download-area");

  // Click tracking via a deliberately-nonexistent path — OSS logs every
  // request including 404s (visible in 文件访问统计 per filename), so this
  // needs no backend at all.
  //
  // Classic <img> tracking-pixel pattern, not sendBeacon/fetch — confirmed
  // via real network tab testing (2026-08-22) that OSS's static website
  // hosting rejects POST with 405, and sendBeacon only ever sends POST.
  // <img> only ever does GET, which OSS's static hosting actually serves.
  function trackClick(platform) {
    var url = "/events/click-" + platform + ".gif";
    var img = new Image();
    img.src = url;
  }

  function btn(href, label, opts) {
    opts = opts || {};
    var a = document.createElement("a");
    a.href = href;
    a.className = "btn" + (opts.secondary ? " secondary" : "");
    a.textContent = label;
    if (opts.track) {
      a.addEventListener("click", function () { trackClick(opts.track); });
    }
    return a;
  }

  function hint(text) {
    var p = document.createElement("p");
    p.className = "hint";
    p.textContent = text;
    return p;
  }

  if (isInAppBrowser) {
    var notice = document.createElement("div");
    notice.className = "weixin-notice";
    notice.textContent = "微信内打开可能无法正常下载，请点击右上角「···」，选择「在浏览器打开」后再试";
    area.appendChild(notice);
  } else if (isIOS) {
    area.appendChild(btn(IOS_LINK, "iOS 内测下载（TestFlight）", { track: "ios" }));
    area.appendChild(hint("首次使用需要先安装 TestFlight"));
  } else if (isAndroid) {
    area.appendChild(btn(ANDROID_LINK, "Android 下载", { track: "android" }));
  } else {
    area.appendChild(hint("请在手机上打开此页面进行安装"));
    area.appendChild(btn(IOS_LINK, "iOS 内测下载（TestFlight）", { track: "ios" }));
    area.appendChild(btn(ANDROID_LINK, "Android 下载", { secondary: true, track: "android" }));
  }
</script>
